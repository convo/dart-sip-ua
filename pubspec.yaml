homepage: https://github.com/cloudwebrtc/dart-sip-ua
environment:
  sdk: ">=2.16.0 <3.0.0"
  flutter: ">=3.22.3"

dependencies:
  collection: ^1.15.0
  crypto: ^3.0.0
  flutter_webrtc: 0.11.7
  intl: ^0.19.0
  logger: ^1.0.0
  parser_error: ^0.2.0
  path: ^1.6.4
  random_string: ^2.0.0
  recase: ^4.0.0
  sdp_transform: ^0.3.2
  uuid: ^4.5.1


dev_dependencies:
  lints: ^2.0.1
  test: ^1.6.7
